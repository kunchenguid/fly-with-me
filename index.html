<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fly With Me</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%232b3050%27/%3E%3Cpath d=%27M8 38 L28 26 L32 32 L36 26 L56 38 L34 34 L32 40 L30 34 Z%27 fill=%27%23f3c2a0%27/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A bird crossing an endless procedural world, above and below the clouds. Soft illustrated light, calm, generated fresh every time."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        color: #e9e4dc;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
      }
      #c {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
      /* The veil: white, and one small line, until the first frame is on screen. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: #fff;
        color: #8c8780;
        transition: opacity 2.2s ease;
        z-index: 10;
      }
      #loading.gone {
        opacity: 0;
        pointer-events: none;
      }
      #loadingText {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 0.72rem;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.8;
        animation: breathe 4.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      #loading.failed #loadingText {
        animation: none;
        opacity: 1;
        letter-spacing: 0.12em;
        text-indent: 0.12em;
        text-transform: none;
        font-size: 0.9rem;
        max-width: 36ch;
      }
      #retryLink[hidden] {
        display: none;
      }
      #retryLink {
        color: inherit;
        font-size: 0.78rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-underline-offset: 5px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      /* The gate: the world stands still behind one button and one line of help. */
      #begin {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 14vh;
        opacity: 0;
        transition: opacity 1.6s ease 0.9s;
        z-index: 5;
      }
      #begin.ready {
        opacity: 1;
      }
      #begin.gone {
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.4s ease;
      }
      #begin .hint {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: max(9vh, calc(env(safe-area-inset-bottom) + 4rem));
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        line-height: 1.9;
        text-align: center;
        color: #f1ece3;
        opacity: 0.86;
        text-shadow:
          0 1px 14px rgba(8, 18, 26, 0.75),
          0 0 3px rgba(8, 18, 26, 0.6);
      }
      #begin .hint span {
        display: block;
      }
      #begin .hint .touch {
        display: none;
      }
      @media (pointer: coarse) {
        #begin .hint .mouse {
          display: none;
        }
        #begin .hint .touch {
          display: block;
        }
      }
      #begin button {
        font: inherit;
        font-size: 1rem;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        padding: 0.95rem 2.5rem;
        border-radius: 999px;
        border: 1px solid rgba(241, 236, 227, 0.6);
        background: rgba(14, 26, 34, 0.28);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f6f2ea;
        cursor: pointer;
        text-shadow: 0 1px 8px rgba(8, 18, 26, 0.6);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      #begin button:hover {
        background: rgba(241, 236, 227, 0.16);
        border-color: rgba(241, 236, 227, 0.95);
      }
      #begin button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      /* The title card, drawn by the engine on the opening's beat. */
      #title {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        padding: 0 24px 15vh;
        pointer-events: none;
        z-index: 4;
      }
      #title p {
        margin: 0;
        opacity: 0;
        text-align: center;
        will-change: opacity, transform, filter;
      }
      #titlePresents {
        font-size: 0.78rem;
        letter-spacing: 0.46em;
        text-indent: 0.46em;
        text-transform: uppercase;
        color: #f3ece0;
        text-shadow: 0 1px 12px rgba(8, 18, 26, 0.7);
      }
      #titleName {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 300;
        font-size: clamp(2.8rem, 7.6vw, 5.6rem);
        letter-spacing: 0.12em;
        text-indent: 0.12em;
        line-height: 1.1;
        color: #f8f2e6;
        text-shadow:
          0 2px 28px rgba(8, 18, 26, 0.55),
          0 0 2px rgba(8, 18, 26, 0.35);
      }
      #hud {
        position: fixed;
        left: max(1rem, env(safe-area-inset-left));
        bottom: max(0.7rem, env(safe-area-inset-bottom));
        display: flex;
        flex-wrap: wrap;
        gap: 0.15rem 0.85rem;
        align-items: center;
        width: max-content;
        max-width: calc(100% - max(1rem, env(safe-area-inset-left)) - max(1rem, env(safe-area-inset-right)));
        box-sizing: border-box;
        padding: 0 1.15rem;
        border-radius: 999px;
        border: 1px solid rgba(241, 236, 227, 0.42);
        background: rgba(14, 26, 34, 0.3);
        backdrop-filter: blur(14px) saturate(1.15);
        -webkit-backdrop-filter: blur(14px) saturate(1.15);
        box-shadow:
          inset 0 1px 0 rgba(248, 242, 230, 0.14),
          0 10px 28px rgba(8, 18, 26, 0.18);
        font-size: 0.74rem;
        letter-spacing: 0.16em;
        text-indent: 0.02em;
        text-transform: lowercase;
        color: #f6f2ea;
        text-shadow: 0 1px 10px rgba(8, 18, 26, 0.55);
        isolation: isolate;
        z-index: 3;
        transition:
          opacity 1.25s ease,
          background 0.45s ease,
          border-color 0.45s ease,
          box-shadow 0.45s ease;
      }
      #hud a,
      #hud button {
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        background: none;
        border: none;
        padding: 0;
        min-height: 44px;
        min-width: 44px;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        text-decoration: none;
        text-underline-offset: 5px;
        text-indent: 0;
      }
      #hud a {
        text-decoration: underline;
        text-decoration-color: rgba(241, 236, 227, 0.38);
        text-decoration-thickness: 1px;
      }
      #hud a:hover,
      #hud button:hover:not([disabled]) {
        color: #fffaf1;
      }
      #hud .dim {
        opacity: 0.62;
        letter-spacing: 0.2em;
        font-size: 0.68rem;
      }
      #hud input[type='range'] {
        appearance: none;
        width: 72px;
        min-height: 44px;
        margin: 0;
        background: transparent;
        accent-color: #f6f2ea;
        cursor: pointer;
      }
      #hud input[type='range']::-webkit-slider-runnable-track {
        height: 1px;
        background: rgba(241, 236, 227, 0.5);
      }
      #hud input[type='range']::-webkit-slider-thumb {
        appearance: none;
        width: 11px;
        height: 11px;
        margin-top: -5px;
        border-radius: 50%;
        border: 1px solid rgba(248, 242, 230, 0.9);
        background: rgba(248, 242, 230, 0.92);
        box-shadow: 0 0 10px rgba(8, 18, 26, 0.35);
      }
      #hud input[type='range']::-moz-range-track {
        height: 1px;
        background: rgba(241, 236, 227, 0.5);
        border: 0;
      }
      #hud input[type='range']::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1px solid rgba(248, 242, 230, 0.9);
        background: rgba(248, 242, 230, 0.92);
      }
      #hud.is-idle {
        opacity: 0.34;
        background: rgba(14, 26, 34, 0.14);
        border-color: rgba(241, 236, 227, 0.18);
        box-shadow: none;
      }
      #hud.is-idle:hover,
      #hud.is-idle:focus-within,
      #hud.is-awake {
        opacity: 1;
        background: rgba(14, 26, 34, 0.3);
        border-color: rgba(241, 236, 227, 0.42);
        box-shadow:
          inset 0 1px 0 rgba(248, 242, 230, 0.14),
          0 10px 28px rgba(8, 18, 26, 0.18);
      }
      #hud[inert] {
        visibility: hidden;
      }
      :focus-visible {
        outline: 2px solid #f1e5b8;
        outline-offset: 5px;
      }
      #c:focus-visible {
        outline-offset: -4px;
      }
      @media (max-width: 640px) {
        #hud {
          font-size: 0.7rem;
        }
        #backendLabel {
          display: none;
        }
      }
      @media (max-height: 500px) {
        #begin {
          padding-bottom: 8vh;
        }
        #begin .hint {
          bottom: 1rem;
          font-size: 0.72rem;
          line-height: 1.6;
        }
        #begin button {
          padding: 0.6rem 1.8rem;
          min-height: 44px;
        }
        #title {
          padding-bottom: 8vh;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas
      id="c"
      inert
      tabindex="0"
      role="img"
      aria-label="An autonomous bird flight. Left-drag looks around, right-drag steers, arrow keys nudge; space pauses or resumes."
    ></canvas>
    <div id="title" aria-hidden="true">
      <p id="titlePresents">Kun Chen Presents</p>
      <p id="titleName">Fly With Me</p>
    </div>
    <div id="begin">
      <button id="beginBtn" disabled>begin</button>
      <p class="hint">
        <span>A bird crossing an endless world. It flies itself; there is nothing to do.</span>
        <span class="mouse">Left-drag looks around &middot; right-drag steers &middot; the wheel zooms &middot; space pauses</span>
        <span class="touch">Drag to steer</span>
      </p>
    </div>
    <div id="loading">
      <p id="loadingText" role="status">waking the world</p>
      <a id="retryLink" hidden>try WebGL2</a>
      <noscript>JavaScript is needed to create this world.</noscript>
    </div>
    <div id="hud" inert>
      <a id="shareLink" href="#" title="A link to this exact world">share this world</a>
      <button id="muteBtn" aria-label="Mute sound" title="Toggle sound" aria-pressed="false">sound on</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" title="Volume" />
      <button id="pauseBtn" aria-label="Pause flight" title="Pause flight" aria-pressed="false" disabled>
        pause
      </button>
      <span id="backendLabel" class="dim"></span>
    </div>

    <script>
      // This also catches import failures, before the module can install its lifecycle.
      window.flightFailure = () => {
        if (window.flightFailed) return;
        window.flightFailed = true;
        window.__fly?.dispose?.();
        const veil = document.getElementById('loading');
        veil.classList.remove('gone');
        veil.classList.add('failed');
        for (const id of ['begin', 'hud', 'c']) document.getElementById(id).inert = true;
        document.getElementById('begin').classList.add('gone');
        document.getElementById('loadingText').textContent = window.__fly
          ? 'The view was interrupted. Try starting it again.'
          : 'The view could not start. Check your connection or try again.';
        const link = document.getElementById('retryLink'),
          url = new URL(location.href);
        link.textContent = url.searchParams.get('webgl') === '1' ? 'restart view' : 'try WebGL2';
        url.searchParams.set('webgl', '1');
        link.href = url;
        link.hidden = false;
      };
      addEventListener('error', window.flightFailure, true);
      setTimeout(() => {
        if (!window.__fly && !window.flightFailed)
          document.getElementById('loadingText').textContent = 'still waking. this page needs a connection';
      }, 20000);
      addEventListener('unhandledrejection', window.flightFailure);
    </script>
    <script>
      (() => {
        const hud = document.getElementById('hud');
        const idleMs = 2800;
        let idleTimer = 0;
        const armIdle = () => {
          clearTimeout(idleTimer);
          if (hud.inert) return;
          idleTimer = setTimeout(() => {
            hud.classList.add('is-idle');
            hud.classList.remove('is-awake');
          }, idleMs);
        };
        const wake = () => {
          if (hud.inert) return;
          hud.classList.remove('is-idle');
          hud.classList.add('is-awake');
          armIdle();
        };
        const syncActive = () => {
          clearTimeout(idleTimer);
          hud.classList.remove('is-idle', 'is-awake');
          if (!hud.inert) armIdle();
        };
        new MutationObserver(syncActive).observe(hud, { attributes: true, attributeFilter: ['inert'] });
        hud.addEventListener('pointerenter', wake);
        hud.addEventListener('pointerdown', wake, true);
        hud.addEventListener('focusin', wake);
        hud.addEventListener('pointerleave', () => {
          if (!hud.contains(document.activeElement)) armIdle();
        });
        syncActive();
      })();
    </script>
    <!-- The engine. Modules need a server (a local one is fine); the page cannot run from file://. -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
